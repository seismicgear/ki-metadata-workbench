# Private preparation artifact. Only this generic wrapper may be copied to the
# fixed public destination after review; the capsule and QA inputs stay secrets.
name: KI Code released Windows customer acceptance
on:
  workflow_dispatch:
    inputs:
      capsule_sha256:
        description: Reviewed encrypted-secret capsule digest
        type: string
        required: true
      config_sha256:
        description: Reviewed private acceptance configuration digest
        type: string
        required: true
      capacity_sha256:
        description: Current public-runner eligibility receipt digest
        type: string
        required: true
      workflow_sha256:
        description: Reviewed exact public wrapper digest
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ki-code-released-customer-acceptance
  cancel-in-progress: false
jobs:
  customer-upgrade:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'seismicgear/ki-metadata-workbench' &&
      toJSON(github.event.repository.private) == 'false' &&
      vars.KI_CODE_CUSTOMER_UPGRADE_NO_CHARGE == 'true' &&
      inputs.capsule_sha256 != '' &&
      inputs.capsule_sha256 == vars.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_SHA256 &&
      inputs.config_sha256 != '' &&
      inputs.config_sha256 == vars.KI_CODE_CUSTOMER_UPGRADE_CONFIG_SHA256 &&
      inputs.capacity_sha256 != '' &&
      inputs.capacity_sha256 == vars.KI_CODE_CUSTOMER_UPGRADE_CAPACITY_SHA256 &&
      inputs.workflow_sha256 != '' &&
      inputs.workflow_sha256 == vars.KI_CODE_CUSTOMER_UPGRADE_WORKFLOW_SHA256
    runs-on: windows-2022
    timeout-minutes: 180
    environment: ki-code-customer-upgrade
    defaults:
      run:
        shell: pwsh
    env:
      KI_CODE_CUSTOMER_UPGRADE_CAPSULE_SHA256: ${{ inputs.capsule_sha256 }}
      KI_CODE_CUSTOMER_UPGRADE_CONFIG_SHA256: ${{ inputs.config_sha256 }}
      KI_CODE_CUSTOMER_UPGRADE_CAPACITY_SHA256: ${{ inputs.capacity_sha256 }}
      KI_CODE_CUSTOMER_UPGRADE_WORKFLOW_SHA256: ${{ inputs.workflow_sha256 }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify public route and unpack the private reviewed harness
        env:
          KI_CODE_CUSTOMER_UPGRADE_CAPSULE_PART_1: ${{ secrets.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_PART_1 }}
          KI_CODE_CUSTOMER_UPGRADE_CAPSULE_PART_2: ${{ secrets.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_PART_2 }}
          KI_CODE_CUSTOMER_UPGRADE_CONFIG_JSON: ${{ secrets.KI_CODE_CUSTOMER_UPGRADE_CONFIG_JSON }}
          KI_CODE_CUSTOMER_UPGRADE_CAPACITY_JSON: ${{ secrets.KI_CODE_CUSTOMER_UPGRADE_CAPACITY_JSON }}
          KI_CODE_CUSTOMER_UPGRADE_RECEIPT_PUBLIC_KEY: ${{ vars.KI_CODE_CUSTOMER_UPGRADE_RECEIPT_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $private = Join-Path $env:RUNNER_TEMP ('ki-code-customer-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $private) { throw 'A prior attempt owns this private directory.' }
          $null = New-Item -ItemType Directory -Path $private
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($sid in @([Security.Principal.WindowsIdentity]::GetCurrent().User, [Security.Principal.SecurityIdentifier]::new('S-1-5-18'))) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
          }
          Set-Acl -LiteralPath $private -AclObject $acl
          $env:KI_CODE_ACCEPTANCE_DIR = $private
          @'
          // BEGIN CAPSULE BOOTSTRAP
          import {createHash,createPublicKey} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {readFile,writeFile,mkdir,appendFile} from 'node:fs/promises';
          import path from 'node:path';
          const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          const check=(value)=>{if(!value)throw new Error('PUBLIC_ROUTE_INPUTS_INVALID');};
          const hex=/^[a-f0-9]{64}$/,commit=/^[a-f0-9]{40}$/;
          const repository='seismicgear/ki-metadata-workbench';
          const workflow='.github/workflows/ki-code-customer-upgrade.yml';
          const files=['.github/workflows/windows-desktop.yml','tests/desktop/installed-windows.ps1','tests/desktop/customer-upgrade-windows.ps1','tests/desktop/customer-upgrade.mjs','tests/desktop/customer-upgrade-preflight.mjs'];
          async function bootstrap(){
            check(process.env.GITHUB_EVENT_NAME==='workflow_dispatch'&&process.env.GITHUB_REF==='refs/heads/main'&&process.env.GITHUB_REPOSITORY===repository&&process.env.RUNNER_ENVIRONMENT==='github-hosted'&&process.env.RUNNER_OS==='Windows');
            const event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8'));
            check(event.repository?.full_name===repository&&event.repository.private===false);
            const revision=process.env.GITHUB_WORKFLOW_SHA;
            check(commit.test(revision||'')&&revision===process.env.GITHUB_SHA&&process.env.GITHUB_WORKFLOW_REF===repository+'/'+workflow+'@refs/heads/main');
            const response=await fetch('https://raw.githubusercontent.com/'+repository+'/'+revision+'/'+workflow,{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(30000)});
            check(response.status===200);
            const wrapper=Buffer.from(await response.arrayBuffer());
            check(wrapper.length>0&&wrapper.length<128*1024&&hex.test(process.env.KI_CODE_CUSTOMER_UPGRADE_WORKFLOW_SHA256||'')&&digest(wrapper)===process.env.KI_CODE_CUSTOMER_UPGRADE_WORKFLOW_SHA256);
            const parts=[process.env.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_PART_1,process.env.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_PART_2];
            check(parts.every(part=>typeof part==='string'&&Buffer.byteLength(part)<=24*1024)&&parts[0].length>0);
            const encoded=parts.join('');
            check(typeof encoded==='string'&&encoded.length>0&&Buffer.byteLength(encoded)<=48*1024&&/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded));
            const compressed=Buffer.from(encoded,'base64');
            check(compressed.toString('base64')===encoded&&hex.test(process.env.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_SHA256||'')&&digest(compressed)===process.env.KI_CODE_CUSTOMER_UPGRADE_CAPSULE_SHA256);
            const capsule=JSON.parse(gunzipSync(compressed,{maxOutputLength:512*1024}).toString('utf8'));
            check(capsule?.schemaVersion==='ki-code.windows-acceptance-capsule.v1'&&capsule.sourceRepository==='seismicgear/KI-Code'&&commit.test(capsule.sourceCommit||''));
            check(capsule.runnerRepository===repository&&capsule.runnerWorkflowPath===workflow&&capsule.runnerWrapperSha256===digest(wrapper)&&Array.isArray(capsule.files)&&capsule.files.length===files.length);
            const seen=new Set(),verified=[];
            for(const file of capsule.files){
              check(files.includes(file?.path)&&!seen.has(file.path));seen.add(file.path);
              check(typeof file.content==='string'&&file.content.length>0&&!file.content.includes('\0'));
              const bytes=Buffer.from(file.content,'utf8');
              check(Number.isSafeInteger(file.bytes)&&file.bytes===bytes.length&&hex.test(file.sha256||'')&&digest(bytes)===file.sha256);
              verified.push({name:file.path,bytes});
            }
            const inputs=[];
            for(const kind of ['CONFIG','CAPACITY']){
              const value=process.env['KI_CODE_CUSTOMER_UPGRADE_'+kind+'_JSON'];
              const locked=process.env['KI_CODE_CUSTOMER_UPGRADE_'+kind+'_SHA256'];
              check(typeof value==='string'&&Buffer.byteLength(value)>0&&Buffer.byteLength(value)<=24*1024&&hex.test(locked||'')&&digest(value)===locked);
              JSON.parse(value);inputs.push({name:'review/'+kind.toLowerCase()+'.json',bytes:Buffer.from(value)});
            }
            const pem=process.env.KI_CODE_CUSTOMER_UPGRADE_RECEIPT_PUBLIC_KEY;
            check(typeof pem==='string'&&pem.startsWith('-----BEGIN PUBLIC KEY-----')&&pem.length<=16384&&!pem.includes('PRIVATE KEY'));
            const key=createPublicKey(pem);check(key.type==='public'&&key.asymmetricKeyType==='rsa'&&key.asymmetricKeyDetails.modulusLength>=2048&&key.asymmetricKeyDetails.modulusLength<=4096);
            const root=process.env.KI_CODE_ACCEPTANCE_DIR;
            check(root&&path.dirname(root)===process.env.RUNNER_TEMP);
            const source=path.join(root,'source');await mkdir(source,{recursive:false,mode:0o700});
            for(const file of [...verified,...inputs,{name:'review/receipt-public-key.pem',bytes:Buffer.from(pem)}]){
              const destination=path.join(source,...file.name.split('/'));
              await mkdir(path.dirname(destination),{recursive:true,mode:0o700});
              await writeFile(destination,file.bytes,{flag:'wx',mode:0o600});
            }
            await appendFile(process.env.GITHUB_ENV,'KI_CODE_ACCEPTANCE_DIR='+root+'\n');
            await writeFile(path.join(root,'bootstrap.json'),JSON.stringify({state:'private_inputs_verified',capsuleSha256:digest(compressed),workflowSha256:digest(wrapper),nativeAcceptanceExecuted:false})+'\n',{flag:'wx',mode:0o600});
          }
          try{await bootstrap();}catch{process.stderr.write('Private acceptance inputs or public wrapper binding did not pass.\n');process.exitCode=1;}
          // END CAPSULE BOOTSTRAP
          '@ | & node --input-type=module - *> (Join-Path $private 'bootstrap.log')
          if ($LASTEXITCODE -ne 0) { throw 'Private acceptance inputs are incomplete; native execution did not start.' }
      - name: Check reviewed capacity, release pins and normal QA inputs
        env:
          KI_CODE_QA_PREVIEW_PASSWORD: ${{ secrets.KI_CODE_QA_PREVIEW_PASSWORD }}
          KI_CODE_QA_A_EMAIL: ${{ secrets.KI_CODE_QA_A_EMAIL }}
          KI_CODE_QA_A_PASSWORD: ${{ secrets.KI_CODE_QA_A_PASSWORD }}
          KI_CODE_QA_A_MFA_CODE: ${{ secrets.KI_CODE_QA_A_MFA_CODE }}
          KI_CODE_QA_B_EMAIL: ${{ secrets.KI_CODE_QA_B_EMAIL }}
          KI_CODE_QA_B_PASSWORD: ${{ secrets.KI_CODE_QA_B_PASSWORD }}
          KI_CODE_QA_B_MFA_CODE: ${{ secrets.KI_CODE_QA_B_MFA_CODE }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'source')
          & node tests/desktop/customer-upgrade-preflight.mjs check --config review/config.json --capacity review/capacity.json *> (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'preflight.log')
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed no-charge acceptance inputs did not pass.' }
          & node --input-type=module -e "import {readFile} from 'node:fs/promises'; import {validateConfig} from './tests/desktop/customer-upgrade.mjs'; validateConfig(JSON.parse(await readFile('review/config.json','utf8')));" *> (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'qa-inputs.log')
          if ($LASTEXITCODE -ne 0) { throw 'Normal QA customer inputs are incomplete; installers were not downloaded or run.' }
      - name: Download and verify the two existing released installers
        env:
          KI_CODE_CUSTOMER_UPGRADE_INSTALLER_A_URL: ${{ secrets.KI_CODE_CUSTOMER_UPGRADE_INSTALLER_A_URL }}
          KI_CODE_CUSTOMER_UPGRADE_INSTALLER_B_URL: ${{ secrets.KI_CODE_CUSTOMER_UPGRADE_INSTALLER_B_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'source')
          & node tests/desktop/customer-upgrade-preflight.mjs download --config review/config.json --capacity review/capacity.json --output (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'installers') *> (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'downloads.log')
          if ($LASTEXITCODE -ne 0) { throw 'Released installer bytes did not match the reviewed A/B identities.' }
      - name: Run the real installed customer journey
        env:
          KI_CODE_QA_PREVIEW_PASSWORD: ${{ secrets.KI_CODE_QA_PREVIEW_PASSWORD }}
          KI_CODE_QA_A_EMAIL: ${{ secrets.KI_CODE_QA_A_EMAIL }}
          KI_CODE_QA_A_PASSWORD: ${{ secrets.KI_CODE_QA_A_PASSWORD }}
          KI_CODE_QA_A_MFA_CODE: ${{ secrets.KI_CODE_QA_A_MFA_CODE }}
          KI_CODE_QA_B_EMAIL: ${{ secrets.KI_CODE_QA_B_EMAIL }}
          KI_CODE_QA_B_PASSWORD: ${{ secrets.KI_CODE_QA_B_PASSWORD }}
          KI_CODE_QA_B_MFA_CODE: ${{ secrets.KI_CODE_QA_B_MFA_CODE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'source'
          $installers = Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'installers'
          $receipt = Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'native-receipt.json'
          & pwsh -NoProfile -NonInteractive -File (Join-Path $source 'tests/desktop/installed-windows.ps1') -SetupA (Join-Path $installers 'Setup-A.exe') -SetupB (Join-Path $installers 'Setup-B.exe') -CustomerUpgradeConfig (Join-Path $source 'review/config.json') -Source $source -Receipt $receipt *> (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'native.log')
          if ($LASTEXITCODE -ne 0) { throw 'Installed customer acceptance remains incomplete; private output was retained only in this runner.' }
      - name: Preserve an encrypted receipt and public criterion status
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:KI_CODE_ACCEPTANCE_DIR) {
            'Native acceptance did not start. Item 01 remains incomplete.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          $source = Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'source'
          $receipt = Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'native-receipt.json'
          $publicKey = Join-Path $source 'review/receipt-public-key.pem'
          if (!(Test-Path -LiteralPath $receipt) -or !(Test-Path -LiteralPath $publicKey)) {
            'No complete encrypted native receipt is available. Item 01 remains incomplete.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          $safe = Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'encrypted-summary.json'
          & node (Join-Path $source 'tests/desktop/customer-upgrade-preflight.mjs') publish-receipt --receipt $receipt --public-key $publicKey 1> $safe 2> (Join-Path $env:KI_CODE_ACCEPTANCE_DIR 'receipt-export.log')
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $safe) -or (Get-Item -LiteralPath $safe).Length -gt 900000) {
            'The protected receipt export did not pass. Item 01 remains incomplete.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          '## Installed customer acceptance: encrypted evidence' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -LiteralPath $safe -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # Only the safe projection and encrypted full receipt are retained.
          # No source, account scope, credential, profile, screenshot, raw log,
          # artifact upload, release publication or cache is created.
